[project]
name = "mission-mcp"
version = "0.1.0"
description = "A compact mission-first MCP server for durable agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mcp==2.1.0"]

[project.scripts]
mission-mcp = "mission_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mission_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
